<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan SAKECA - Aplikasi Manajemen Kas Real-Time</title>
    
    <!-- PWA & SEO Meta Tags -->
    <meta name="apple-mobile-web-app-title" content="Keuangan SAKECA">
    <meta name="application-name" content="Keuangan SAKECA">
    <meta name="description" content="Manajemen kas dan keuangan real-time multi-user terintegrasi cloud sync.">

    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Chart.js CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- SheetJS CDN (Export Excel) -->
    <script src="https://jsdelivr.net"></script>

    <!-- Firebase SDK Compat v10 (Real-Time Cloud Sync Multi-Device) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .pulse-live {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">

    <!-- Layer 1: Halaman Login & Registrasi -->
    <div id="authContainer" class="flex min-h-screen items-center justify-center p-4 bg-gradient-to-tr from-slate-950 via-slate-900 to-indigo-950">
        <div class="w-full max-w-md bg-white/95 backdrop-blur-lg rounded-3xl shadow-2xl p-8 border border-white/10">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-indigo-600 text-white shadow-xl shadow-indigo-500/20 mb-4">
                    <i class="fa-solid fa-wallet text-3xl animate-pulse"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">KEUANGAN SAKECA</h1>
                <p class="text-sm text-slate-500 mt-2" id="authSubtitle">Silakan masuk untuk mengelola keuangan</p>
            </div>

            <!-- Form Login -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Pengguna</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-4 text-slate-400"></i>
                        <input type="email" id="loginEmail" required class="w-full pl-11 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all text-sm" placeholder="nama@email.com">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400"></i>
                        <input type="password" id="loginPassword" required class="w-full pl-11 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all text-sm" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Ke Aplikasi
                </button>
                <p class="text-xs text-center text-slate-500 mt-4">Belum punya akun? <a href="#" onclick="toggleAuthMode(false)" class="text-indigo-600 font-bold hover:underline">Daftar Akun Baru</a></p>
            </form>

            <!-- Form Registrasi -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-card absolute left-4 top-4 text-slate-400"></i>
                        <input type="text" id="regName" required class="w-full pl-11 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all text-sm" placeholder="Nama Lengkap Anda">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Pengguna</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-4 text-slate-400"></i>
                        <input type="email" id="regEmail" required class="w-full pl-11 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all text-sm" placeholder="nama@email.com">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Kata Sandi Baru</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400"></i>
                        <input type="password" id="regPassword" required class="w-full pl-11 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all text-sm" placeholder="Minimal 6 Karakter">
                    </div>
                </div>
                <button type="submit" id="registerBtn" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-user-plus"></i> Buat Akun Baru
                </button>
                <p class="text-xs text-center text-slate-500 mt-4">Sudah punya akun? <a href="#" onclick="toggleAuthMode(true)" class="text-indigo-600 font-bold hover:underline">Masuk Sekarang</a></p>
            </form>
        </div>
    </div>

    <!-- Layer 2: Halaman Dashboard Utama -->
    <div id="mainDashboard" class="hidden min-h-screen flex-col">
        <!-- Top Navbar -->
        <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-30 border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-md shadow-indigo-600/20"><i class="fa-solid fa-store text-lg"></i></div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="font-black text-lg tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">KEUANGAN SAKECA</h2>
                            <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full pulse-live" title="Terhubung Real-Time Cloud"></span>
                        </div>
                        <p class="text-[10px] uppercase font-bold tracking-widest text-indigo-400" id="userEmailLabel">Live Sync Active</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <span class="text-xs font-semibold px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-xl" id="txtProfileName">User</span>
                    <button onclick="handleLogout()" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold border border-red-500/20 transition-all duration-200 flex items-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> Keluar
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            <!-- Info Status Banner -->
            <div class="p-4 bg-emerald-50/80 backdrop-blur-sm border border-emerald-200 rounded-2xl flex items-center justify-between text-emerald-800 text-xs sm:text-sm">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-cloud-arrow-up text-emerald-600 animate-bounce text-base"></i>
